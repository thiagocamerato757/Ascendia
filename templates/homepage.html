{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="o-container o-center l-hero">
  <h1 class="l-hero__title">{% trans "Welcome to" %} <span class="text-brand">Ascendia</span></h1>
  <p class="l-hero__lead">
    {% trans "Keep your notes, notebooks and study materials in one place." %}
  </p>
  {% if not user.is_authenticated %}
  <div class="o-cluster o-cluster--center">
    <a href="{% url 'signup' %}" class="c-button c-button--primary c-button--lg">{% trans "Start now" %}</a>
    <a href="{% url 'login' %}" class="c-button c-button--secondary c-button--lg">{% trans "Log in" %}</a>
  </div>
  {% endif %}
</div>
{% endblock %}
