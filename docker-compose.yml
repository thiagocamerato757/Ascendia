services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the database is reached by service name.
      POSTGRES_HOST: db
      # Local model servers (Ollama, LM Studio, llama.cpp) run on the host
      # machine, not in this container.
      ASCENDIA_LOCAL_LLM_HOST: host.docker.internal
      ASCENDIA_SOURCES_ROOT: /data/sources
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop has it).
      - "host.docker.internal:host-gateway"
    volumes:
      # Uploaded source files (private, never served); shared with the worker.
      - sources:/data/sources
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py createcachetable && python manage.py collectstatic --noinput && exec gunicorn core.asgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class uvicorn.workers.UvicornWorker

  # Background tasks (source ingestion, reindexing) from the Postgres queue.
  worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      ASCENDIA_LOCAL_LLM_HOST: host.docker.internal
      ASCENDIA_SOURCES_ROOT: /data/sources
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sources:/data/sources
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command: ["python", "manage.py", "db_worker"]

volumes:
  pgdata:
  sources:
