name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ascendia
          POSTGRES_USER: ascendia
          POSTGRES_PASSWORD: ascendia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ascendia -d ascendia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      DJANGO_DEBUG: "False"
      # Throwaway Fernet key for the provider-credential encryption layer (CI only;
      # protects nothing — tests override it with their own key).
      ASCENDIA_FERNET_KEY: 7reelbMCNaBfLYnwYObk1Ia1BXE0nnY7QPaNDjGq9tQ=
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ascendia
      POSTGRES_USER: ascendia
      POSTGRES_PASSWORD: ascendia
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        run: uv run python manage.py test --verbosity=1

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ascendia:ci .
