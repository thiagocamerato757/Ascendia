# Development overrides — applied automatically by `docker compose up`
# (Compose merges docker-compose.override.yml on top of docker-compose.yml).
#
# It bind-mounts the project into the container so edits to Python, templates,
# CSS and JS take effect live, with no image rebuild. The app runs under uvicorn
# --reload (ASGI, like production), and with DJANGO_DEBUG=True WhiteNoise serves
# static files straight from source (no collectstatic in dev). Dependencies live in /usr/local, not /app, so the
# mount does not shadow them.
#
# Production / CI must use the base file only:
#   docker compose -f docker-compose.yml up --build
services:
  web:
    volumes:
      - .:/app
    command:
      - sh
      - -c
      # uvicorn (ASGI), the same server as production, with --reload. runserver is
      # WSGI and streams differently: it once hid that answers didn't stream in prod.
      - python manage.py migrate --noinput && python manage.py createcachetable && exec uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload
  worker:
    volumes:
      - .:/app
      - sources:/data/sources
