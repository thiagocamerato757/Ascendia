[project]
name = "ascendia"
version = "0.1.0"
description = "Django app for organizing notebooks, notes and study materials"

readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core framework
    "django>=5.0",
    "uvicorn>=0.30",
    "gunicorn>=21.2",
    "python-dotenv>=1.0",
    "pillow>=12.0.0",
    # Database (Postgres + pgvector)
    "psycopg[binary]>=3.2",
    # Static file serving under gunicorn/uvicorn
    "whitenoise>=6.0",
    # LLM provider layer (single interface for OpenAI/Gemini/Claude/DeepSeek/local)
    "litellm>=1.40",
    # Symmetric encryption at rest for provider API keys (Fernet)
    "cryptography>=42.0",
    # HTTP client for live model listing ("Refresh models")
    "requests>=2.31",
    "pymupdf>=1.28.2",
    "pgvector>=0.5.0",
    "django-tasks>=0.12.0",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "django-tasks-db>=0.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
